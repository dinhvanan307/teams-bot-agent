# Include INSIDE an existing HTTPS server{} whose DNS/certificate are managed by IT.
# BOT_ENDPOINT=https://your-approved-domain/teams-bot
# Messaging endpoint=https://your-approved-domain/teams-bot/api/messages
location = /teams-bot/api/messages {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:3978/api/messages;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
location = /teams-bot { return 308 /teams-bot/; }
location = /teams-bot/ { proxy_pass http://127.0.0.1:3978/; }
location = /teams-bot/privacy { proxy_pass http://127.0.0.1:3978/privacy; }
location = /teams-bot/terms { proxy_pass http://127.0.0.1:3978/terms; }
# Health/readiness/admin are deliberately not public in this reference configuration.
location /teams-bot/ { return 404; }
